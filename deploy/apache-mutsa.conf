<VirtualHost *:80>
    ServerName mutsa.dev.me.kr

    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/mutsa_error.log
    CustomLog ${APACHE_LOG_DIR}/mutsa_access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName mutsa.dev.me.kr

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/dev.me.kr/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/dev.me.kr/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8082/
    ProxyPassReverse / http://127.0.0.1:8082/

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    ErrorLog ${APACHE_LOG_DIR}/mutsa_error.log
    CustomLog ${APACHE_LOG_DIR}/mutsa_access.log combined
</VirtualHost>
</IfModule>
