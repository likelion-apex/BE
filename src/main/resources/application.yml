spring:
  application:
    name: apex-BE

  profiles:
    default: local

  datasource:
    url: jdbc:h2:mem:apexdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  # 운영 DB 마이그레이션은 prod 프로필에서만 활성화한다.
  flyway:
    enabled: false

  h2:
    console:
      enabled: true
      path: /h2-console

# 운영 비밀값은 환경변수로 주입합니다. 로컬 기본값은 application-local.yml의
# 외부 호출이 불가능한 더미 설정을 사용합니다.
app:
  # 프론트엔드와 백엔드가 서로 다른 도메인에 배포되므로, DB/정적 자산에 저장된
  # 상대경로(/images/...) 를 API 응답에서 절대 URL로 바꿀 때 쓰는 백엔드 자체 도메인.
  # 비워두면(기본값) 상대경로를 그대로 반환한다 (로컬/테스트 기존 동작 유지).
  public-base-url: ${APP_PUBLIC_BASE_URL:}

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  client-secret: ${KAKAO_CLIENT_SECRET:}
  redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:3000/onboarding/kakaocallback}
  token-uri: https://kauth.kakao.com/oauth/token
  user-info-uri: https://kapi.kakao.com/v2/user/me
  image-search-key: ${KAKAO_IMAGE_SEARCH_KEY:}
  image-search-url: https://dapi.kakao.com/v2/search/image

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000       # 1 hour (ms)
  refresh-token-expiration: 1209600000   # 14 days (ms)

test-login:
  enabled: ${TEST_LOGIN_ENABLED:false}

mfds:
  enabled: true
  service-key: ${MFDS_SERVICE_KEY:}
  ingredient-info-url: https://apis.data.go.kr/1471000/CsmtcsIngdCpntInfoService01/getCsmtcsIngdCpntInfoService01
  regulation-info-url: https://apis.data.go.kr/1471000/CsmtcsReglMaterialInfoService/getCsmtcsReglMaterialInfoService

openai:
  api-key: ${OPENAI_API_KEY:}
  api-url: ${OPENAI_API_URL:https://api.openai.com/v1/chat/completions}
  product-api-url: ${OPENAI_PRODUCT_API_URL:https://api.openai.com/v1/responses}
  model: gpt-4o-mini
  organization-id: ${OPENAI_ORGANIZATION_ID:}
  routine-model: ${OPENAI_ROUTINE_MODEL:gpt-4o-mini}
  routine-prompt-version: "3.6"
  product-model: ${OPENAI_PRODUCT_MODEL:gpt-5.6-luna}
  product-fallback-model: ${OPENAI_PRODUCT_FALLBACK_MODEL:gpt-5.4-mini}
  product-reasoning-effort: ${OPENAI_PRODUCT_REASONING_EFFORT:low}
  product-prompt-version: "2.0"
  product-fallback-enabled: ${OPENAI_PRODUCT_FALLBACK_ENABLED:true}
  connect-timeout: 5s
  read-timeout: 120s
  product-cache-ttl: 30d
  product-negative-cache-ttl: 1d
  max-output-tokens: 6000
  product-max-output-tokens: 12000

youtube:
  api-key: ${YOUTUBE_API_KEY:}
  base-url: https://www.googleapis.com
  max-duration: 5m
  connect-timeout: 5s
  read-timeout: 10s

gemini:
  api-key: ${GEMINI_API_KEY:}
  base-url: https://generativelanguage.googleapis.com
  model: ${GEMINI_MODEL:gemini-3.6-flash}
  connect-timeout: 5s
  read-timeout: 120s
  cache-ttl: 30d
  cache-maximum-size: 10000

groq:
  api-key: ${GROQ_API_KEY:}
  base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
  model: ${GROQ_MODEL:openai/gpt-oss-120b}

shortform:
  ai-fallback:
    gemini-enabled: ${SHORTFORM_GEMINI_FALLBACK_ENABLED:true}
    gemini-model-routing-enabled: ${SHORTFORM_GEMINI_MODEL_ROUTING_ENABLED:true}
    open-ai-attempts-before-gemini: ${SHORTFORM_OPENAI_ATTEMPTS_BEFORE_GEMINI:2}
    gemini-max-output-tokens: 6000
    gemini-video-models: ${SHORTFORM_GEMINI_VIDEO_MODELS:gemini-3.7-flash,gemini-3.5-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-3-flash-preview}
    gemini-text-models: ${SHORTFORM_GEMINI_TEXT_MODELS:gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-3.5-flash,gemini-3.6-flash,gemini-3.7-flash,gemini-3-flash-preview}
    gemini-product-models: ${SHORTFORM_GEMINI_PRODUCT_MODELS:gemini-3.5-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-3.6-flash,gemini-3.7-flash,gemini-3-flash-preview}
    gemini-max-routing-duration: ${SHORTFORM_GEMINI_MAX_ROUTING_DURATION:3m}
    gemini-default-rate-limit-delay: 30s
    gemini-default-transient-delay: 2s
  product-enrichment:
    cache-enabled: ${SHORTFORM_PRODUCT_CACHE_ENABLED:true}
    gemini-fallback-enabled: ${SHORTFORM_GEMINI_FALLBACK_ENABLED:true}
    gemini-prompt-version: "1.1"
    gemini-max-output-tokens: 12000
    estimated-resolution-threshold: 0.60

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

product:
  seed:
    enabled: true
    location: classpath:data/products-seed.csv
  popular-cache:
    size: 100

inventory:
  ai-cache-ttl: 30d
  connect-timeout: ${INVENTORY_CONNECT_TIMEOUT:1s}
  read-timeout: ${INVENTORY_READ_TIMEOUT:10s}
  gemini-connect-timeout: 3s
  gemini-read-timeout: 5s
  groq-connect-timeout: 1s
  groq-read-timeout: 2s
  openai-max-output-tokens: 400

cors:
  allowed-origins: http://localhost:3000
