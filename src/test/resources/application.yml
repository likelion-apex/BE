# 테스트 실행 시 실제 카카오/JWT 시크릿(.env) 없이도 스프링 컨텍스트가 뜰 수 있도록
# 더미 값을 제공합니다. 실제 값은 절대 여기에 넣지 마세요.
kakao:
  client-id: test-client-id
  client-secret: test-client-secret
  redirect-uri: http://localhost:3000/auth/kakao/callback
  token-uri: https://kauth.kakao.com/oauth/token
  user-info-uri: https://kapi.kakao.com/v2/user/me
  image-search-key: test-kakao-image-search-key
  image-search-url: https://dapi.kakao.com/v2/search/image

jwt:
  secret: dGVzdC1vbmx5LWp3dC1zZWNyZXQtZG8tbm90LXVzZS1pbi1wcm9kdWN0aW9uLTEyMzQ1Ng==
  access-token-expiration: 3600000
  refresh-token-expiration: 1209600000

mfds:
  enabled: false
  service-key: test-mfds-service-key
  ingredient-info-url: https://apis.data.go.kr/1471000/CsmtcsIngdCpntInfoService01/getCsmtcsIngdCpntInfoService01
  regulation-info-url: https://apis.data.go.kr/1471000/CsmtcsReglMaterialInfoService/getCsmtcsReglMaterialInfoService

openai:
  api-key: test-openai-api-key
  api-url: https://api.openai.com/v1/chat/completions
  product-api-url: https://api.openai.com/v1/responses
  model: gpt-4o-mini
  organization-id: ""

gemini:
  api-key: test-gemini-api-key
  base-url: https://generativelanguage.googleapis.com
  model: gemini-3.6-flash

groq:
  api-key: test-groq-api-key
  base-url: https://api.groq.com/openai/v1
  model: openai/gpt-oss-120b

cors:
  allowed-origins: http://localhost:3000

product:
  seed:
    enabled: false
    kakao-delay-ms: 0

inventory:
  ai-cache-ttl: 30d
  connect-timeout: 1s
  read-timeout: 10s
  gemini-connect-timeout: 3s
  gemini-read-timeout: 5s
  groq-connect-timeout: 1s
  groq-read-timeout: 2s
  openai-max-output-tokens: 400
