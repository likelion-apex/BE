spring:
  application:
    name: apex-BE

  datasource:
    url: jdbc:h2:mem:apexdb;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

# 민감한 값(REST API 키, Client Secret, JWT Secret)은 프로젝트 루트의 .env 파일에서 주입됩니다.
# .env는 git에 커밋되지 않으며, 필요한 키 목록은 .env.example을 참고하세요.
kakao:
  client-id: ${KAKAO_CLIENT_ID}
  client-secret: ${KAKAO_CLIENT_SECRET:}
  redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:5173/auth/kakao/callback}
  token-uri: https://kauth.kakao.com/oauth/token
  user-info-uri: https://kapi.kakao.com/v2/user/me

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000       # 1 hour (ms)
  refresh-token-expiration: 1209600000   # 14 days (ms)

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

cors:
  allowed-origins: http://localhost:5173
