spring:
  datasource:
    url: jdbc:h2:mem:apexdb;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

# 민감한 값(REST API 키, Client Secret, JWT Secret)은 프로젝트 루트의 .env 파일에서 주입됩니다.
# .env는 git에 커밋되지 않으며, 필요한 키 목록은 .env.example을 참고하세요.
kakao:
  client-id: ${KAKAO_CLIENT_ID}
  client-secret: ${KAKAO_CLIENT_SECRET:}
  redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:3000/auth/kakao/callback}
  token-uri: https://kauth.kakao.com/oauth/token
  user-info-uri: https://kapi.kakao.com/v2/user/me
  image-search-key: ${KAKAO_IMAGE_SEARCH_KEY:}
  image-search-url: https://dapi.kakao.com/v2/search/image

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000       # 1 hour (ms)
  refresh-token-expiration: 1209600000   # 14 days (ms)

mfds:
  service-key: ${MFDS_SERVICE_KEY:}
  ingredient-info-url: https://apis.data.go.kr/1471000/CsmtcsIngdCpntInfoService01/getCsmtcsIngdCpntInfoService01
  regulation-info-url: https://apis.data.go.kr/1471000/CsmtcsReglMaterialInfoService/getCsmtcsReglMaterialInfoService

openai:
  api-key: ${OPENAI_API_KEY:}
  api-url: https://api.openai.com/v1/chat/completions
  model: gpt-4o-mini
  organization-id: ${OPENAI_ORGANIZATION_ID:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

cors:
  allowed-origins: http://localhost:3000
